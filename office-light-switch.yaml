substitutions:
  device_name: office-light-switch
  friendly_name: "Bouton lumiere bureau"
  area: "Bureau"

  # Capteur HA utilise comme inhibiteur de nightlight quand absent
  ha_away_sensor: input_boolean.away_mode

  # ESP-NOW — MACs des senders
  espnow_peer_mac_desk: "54:43:B2:71:82:F4"      # MAC de desk-light-switch
  espnow_peer_mac_hallway: "54:43:B2:70:81:70"   # MAC de office-hallway-light-switch


esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: ${area}

packages:
  hw:
    url: https://github.com/AntorFr/esphome-tx-ultimate
    ref: main
    files:
      - packages/tx_ultimate_hw.yaml
    refresh: 0s
  themes:
    url: https://github.com/AntorFr/esphome-tx-ultimate
    ref: main
    files:
      - packages/themes/default.yaml
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${device_name}.intra.sberard.fr
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret ap_password

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption
  reboot_timeout: 15min

web_server:

# ── ESP-NOW fallback : reçoit les commandes de desk-light-switch et office-hallway-light-switch ─
external_components:
  - source:
      type: git
      url: https://github.com/AntorFr/esphome-espnow
      ref: main
    refresh: 0s
    components: [espnow_receiver]

espnow_receiver:
  - id: espnow_rx_desk
    peer_mac: ${espnow_peer_mac_desk}      # desk-light-switch → relay_1
    light_id: relay_1
  - id: espnow_rx_hallway
    peer_mac: ${espnow_peer_mac_hallway}   # office-hallway-light-switch → relay_2
    light_id: relay_2

binary_sensor:
  - platform: homeassistant
    id: away_sensor
    entity_id: ${ha_away_sensor}
    trigger_on_initial_state: true

  # Swipe gauche : allume relay_2 pendant 30s (minuterie veilleuse)
  - id: !extend swipe_left
    on_press:
      - script.execute: swipe_left_timer

media_player:
  - platform: speaker
    name: "Media Player"
    id: mp
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 1.0
    files:
      - id: sound_click
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/clic.flac
      - id: sound_long_press
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/long_press.flac
      - id: sound_multi_press
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/multi_press.flac
      - id: sound_slide
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/slide.flac

tx_ultimate_switch:
  id: tx
  button_count: 3

  buttons:
    button_1:
      switch_relay: true
      relay: relay_2
    button_2:
      switch_relay: true
      relay: relay_1
    button_3:
      switch_relay: true
      relay: relay_3

  leds: leds
  leds_top: leds_top
  leds_nightlight: leds_nightlight
  leds_buttons:
    - leds_button_left
    - leds_button_middle
    - leds_button_right

  vibra: vibra
  media_player: mp
  api_connected: api_connected

  nightlight:
    away_sensor: away_sensor

  active_theme: "Explore the Stars"

  sound_packs:
    - name: explore_the_stars
      click: sound_click
      long_press: sound_long_press
      multi_press: sound_multi_press
      slide: sound_slide

script:
  - id: swipe_left_timer
    mode: restart
    then:
      - light.turn_on: relay_2
      - delay: 30s
      - light.turn_off: relay_2
