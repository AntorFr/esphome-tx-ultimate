# packages/themes/default.yaml
# Thèmes chargés par défaut sur tous les devices TX Ultimate.
# Ajouter ici tout nouveau thème à déployer globalement.

tx_ultimate_switch:
  themes:
    - name: "Default"
      button:
        color: [0, 0, 100]
        brightness: 0.7
      nightlight:
        color: [80, 70, 0]
        brightness: 0.2
      sleep:
        color: [60, 0, 0]  # rouge doux — repère de nuit sans gêner le sommeil
        brightness: 0.08
      touch:
        color: [0, 100, 100]
        brightness: 1.0
        effect:
          type: scan
          move_interval: 100ms
          scan_width: 1
      swipe_left:
        color: [0, 100, 0]
        brightness: 1.0
      swipe_right:
        color: [100, 0, 70]
        brightness: 1.0
      long_press:
        color: [100, 0, 0]
        brightness: 1.0
      multi_touch:
        color: [0, 0, 0]
        brightness: 1.0
        effect:
          type: rainbow
          speed: 10
          width: 20
      sound: explore_the_stars

    - name: "Explore the Stars"
      button:
        color: [0, 0, 100]
        brightness: 0.6
      nightlight:
        color: [20, 0, 80]
        brightness: 0.15
        effect:
          type: stars
          probability: 10%
          color: [100, 100, 100]
      sleep:
        color: [60, 0, 0]  # rouge doux — repère de nuit sans gêner le sommeil
        brightness: 0.08
      touch:
        color: [0, 50, 100]
        brightness: 1.0
        effect:
          type: scan
          move_interval: 100ms
          scan_width: 1
      swipe_left:
        color: [0, 80, 100]
        brightness: 1.0
      swipe_right:
        color: [50, 0, 100]
        brightness: 1.0
      long_press:
        color: [100, 20, 100]
        brightness: 1.0
      multi_touch:
        color: [0, 0, 0]
        brightness: 1.0
        effect:
          type: rainbow
          speed: 10
          width: 20
      sound: explore_the_stars

    - name: "Christmas"
      button:
        color: [100, 5, 5]
        brightness: 0.8
      nightlight:
        color: [0, 60, 0]
        brightness: 0.3
        effect:
          type: christmas
          blank_size: 1
          bit_size: 1
      sleep:
        color: [60, 0, 0]  # rouge doux — repère de nuit sans gêner le sommeil
        brightness: 0.08
      touch:
        color: [100, 50, 0]
        brightness: 1.0
        effect:
          type: scan
          move_interval: 100ms
          scan_width: 1
      swipe_left:
        color: [0, 80, 0]
        brightness: 1.0
      swipe_right:
        color: [100, 0, 0]
        brightness: 1.0
      long_press:
        color: [100, 80, 0]
        brightness: 1.0
      multi_touch:
        color: [0, 0, 0]
        brightness: 1.0
        effect:
          type: rainbow
          speed: 10
          width: 20
      sound: explore_the_stars
