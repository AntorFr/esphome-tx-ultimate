# packages/themes/christmas.yaml
# Christmas theme — warm red/green palette with Christmas effect on nightlight.

tx_ultimate_switch:
  themes:
    - name: "Christmas"
      button:
        color: [100, 5, 5]
        brightness: 0.8
      nightlight:
        color: [0, 60, 0]
        brightness: 0.3
        effect:
          addressable_christmas:
            blank_size: 1
            bit_size: 1
      sleep:
        color: [60, 0, 0]  # rouge doux — repère de nuit sans gêner le sommeil
        brightness: 0.08
      touch:
        color: [100, 50, 0]
        brightness: 1.0
        effect:
          addressable_scan:
            move_interval: 100ms
            scan_width: 1
      swipe_left:
        color: [0, 80, 0]
        brightness: 1.0
      swipe_right:
        color: [100, 0, 0]
        brightness: 1.0
      long_press:
        color: [100, 80, 0]
        brightness: 1.0
      multi_touch:
        color: [0, 0, 0]
        brightness: 1.0
        effect:
          addressable_rainbow:
            speed: 10
            width: 20
      sound: explore_the_stars
