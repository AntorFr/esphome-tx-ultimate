# packages/themes/explore_the_stars.yaml
# Explore the Stars theme — deep space blue/purple palette, star effect on nightlight.

tx_ultimate_switch:
  themes:
    - name: "Explore the Stars"
      button:
        color: [0, 0, 100]
        brightness: 0.6
      nightlight:
        color: [20, 0, 80]
        brightness: 0.15
        effect:
          addressable_stars:
            stars_probability: 10%
            color:
              red: 100%
              green: 100%
              blue: 100%
      sleep:
        color: [60, 0, 0]  # rouge doux — repère de nuit sans gêner le sommeil
        brightness: 0.08
      touch:
        color: [0, 50, 100]
        brightness: 1.0
        effect:
          addressable_scan:
            move_interval: 100ms
            scan_width: 1
      swipe_left:
        color: [0, 80, 100]
        brightness: 1.0
      swipe_right:
        color: [50, 0, 100]
        brightness: 1.0
      long_press:
        color: [100, 20, 100]
        brightness: 1.0
      multi_touch:
        color: [0, 0, 0]
        brightness: 1.0
        effect:
          addressable_rainbow:
            speed: 10
            width: 20
      sound: explore_the_stars
