# tx_ultimate_hw.yaml
# Hardware package for the Sonoff TX Ultimate (ESP32 variant).
# Include this in every device YAML. It declares all hardware components
# (ESP32, PSRAM, UART, I2S, GPIO, LEDs) and wires them to tx_ultimate_switch.
#
# Usage:
#   packages:
#     hw: github://AntorFr/esphome-tx-ultimate/packages/tx_ultimate_hw.yaml@main

substitutions:
  # GPIO pins — TX Ultimate hardware defaults, override only for non-standard variants
  relay_1_pin: GPIO18
  relay_2_pin: GPIO17
  relay_3_pin: GPIO27
  relay_4_pin: GPIO23
  vibra_motor_pin: GPIO21
  pa_power_pin: GPIO26
  status_led_pin: GPIO33
  uart_tx_pin: GPIO19
  uart_rx_pin: GPIO22
  touchpanel_power_pin: GPIO5
  led_pin: GPIO13
  audio_lrclk_pin: GPIO4
  audio_bclk_pin: GPIO2
  audio_sdata_pin: GPIO15

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.0"
    sdkconfig_options:
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"

psram:
  mode: quad
  speed: 40MHz

external_components:
  - source:
      type: git
      url: https://github.com/AntorFr/esphome-tx-ultimate
      ref: main
    refresh: 0s
    components: [tx_ultimate_touch, tx_ultimate_switch]
  - source: github://AntorFr/esphome-addressable-effects@main
    components: [custom_addressable_effects]

custom_addressable_effects:

improv_serial:
captive_portal:

logger:
  level: INFO

# ── UART (touch panel) ────────────────────────────────────────────────────────
uart:
  id: my_uart
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 115200
  data_bits: 8
  stop_bits: 1
  parity: NONE

# ── Touch component ───────────────────────────────────────────────────────────
tx_ultimate_touch:
  id: tx_touch
  uart_id: my_uart
  # long_press_x_offset: 16  # default; change only for hardware variants
  on_press:
    - lambda: id(tx).on_touch_press();
  on_release:
    - lambda: id(tx).on_touch_release(touch.x);
  on_swipe_left:
    - lambda: id(tx).on_swipe_left();
    - binary_sensor.template.publish:
        id: swipe_left
        state: ON
  on_swipe_right:
    - lambda: id(tx).on_swipe_right();
    - binary_sensor.template.publish:
        id: swipe_right
        state: ON
  on_full_touch_release:
    - lambda: id(tx).on_full_touch_release();
    - binary_sensor.template.publish:
        id: multi_touch
        state: ON
  on_long_touch_release:
    - lambda: id(tx).on_long_touch_release();
    - binary_sensor.template.publish:
        id: long_press
        state: ON

# ── I2S Audio ─────────────────────────────────────────────────────────────────
i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: ${audio_lrclk_pin}
    i2s_bclk_pin:
      number: ${audio_bclk_pin}
      ignore_strapping_warning: true

# ── Switches (hardware) ───────────────────────────────────────────────────────
switch:
  - id: vibra
    platform: gpio
    pin: ${vibra_motor_pin}
    name: "Vibration"
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 50ms
      - switch.turn_off: vibra

  - id: pa_power
    platform: gpio
    pin: ${pa_power_pin}
    name: "PA Power"
    internal: true
    restore_mode: ALWAYS_ON

  - id: touch_power
    platform: gpio
    name: "Touch Panel Power"
    pin:
      number: ${touchpanel_power_pin}
      inverted: true
      ignore_strapping_warning: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

# ── Relay outputs ─────────────────────────────────────────────────────────────
output:
  - id: l1_output
    platform: gpio
    pin: ${relay_1_pin}
  - id: l2_output
    platform: gpio
    pin: ${relay_2_pin}
  - id: l3_output
    platform: gpio
    pin: ${relay_3_pin}

# ── LED strip ────────────────────────────────────────────────────────────────
# Relay lights are declared inline by tx_ultimate_switch.buttons[].relay
# (see device YAMLs).
light:
  - id: leds
    platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: ${led_pin}
    num_leds: 28
    name: "NeoPixel Light"
    internal: true
    default_transition_length: 0ms
    max_refresh_rate: 15ms
    effects:
      - addressable_rainbow:
          name: "Rainbow"
          speed: 30
          width: 8
      - pulse:
          name: "Pulse"
          transition_length: 1.4s
          update_interval: 1s

# ── Speaker pipeline ──────────────────────────────────────────────────────────
speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    channel: mono
    i2s_dout_pin:
      number: ${audio_sdata_pin}
      ignore_strapping_warning: true
    bits_per_sample: 16bit
    i2s_audio_id: i2s_output
    dac_type: external
    i2s_comm_fmt: i2s_lsb
    buffer_duration: 200ms

  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

# ── Media player (announces touch sounds) ────────────────────────────────────
# `task_stack_in_psram` + `buffer_size` are required for FLAC decoding stability;
# without them the decoder task can crash silently and no sound is heard.
# Files can be extended by theme packages via `id: !extend mp`.
media_player:
  - platform: speaker
    id: mp
    name: "Media Player"
    task_stack_in_psram: true
    buffer_size: 80000
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
    files:
      - id: sound_click_explore
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/clic.flac
      - id: sound_long_press_explore
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/long_press.flac
      - id: sound_multi_press_explore
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/multi_press.flac
      - id: sound_slide_explore
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/slide.flac
      - id: sound_click_christmas
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/christmas/clic.flac
      - id: sound_long_press_christmas
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/christmas/long_press.flac
      - id: sound_multi_press_christmas
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/christmas/multi_press.flac
      - id: sound_slide_christmas
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/christmas/slide.flac

# ── Default themes (imported via packages) ───────────────────────────────────
packages:
  themes_default:
    url: https://github.com/AntorFr/esphome-tx-ultimate
    ref: main
    files:
      - packages/themes/default.yaml
    #refresh: 0s

# ── tx_ultimate_switch wiring (audio + sound packs) ──────────────────────────
tx_ultimate_switch:
  id: tx
  media_player: mp
  active_theme: "Default"
  theme_select:
    id: tx_theme
    name: "Theme"
    icon: mdi:palette
  sound_packs:
    - name: explore_the_stars
      click:       sound_click_explore
      long_press:  sound_long_press_explore
      multi_press: sound_multi_press_explore
      slide:       sound_slide_explore
    - name: christmas
      click:       sound_click_christmas
      long_press:  sound_long_press_christmas
      multi_press: sound_multi_press_christmas
      slide:       sound_slide_christmas

# ── Connectivity binary sensors ──────────────────────────────────────────────
binary_sensor:
  - platform: status
    name: "API Status"
    id: api_connected
    internal: true
    filters:
      - delayed_off: 30s
    on_press:
      - lambda: id(tx).init_relays();

  - platform: template
    id: wifi_connected
    internal: true
    lambda: |-
      return wifi::global_wifi_component != nullptr &&
             wifi::global_wifi_component->is_connected();
    filters:
      - delayed_off: 5s

  # ── Touch event binary sensors (exposed to HA for automations) ─────────────
  - id: swipe_left
    platform: template
    name: "Swipe Left"
    on_press:
      - delay: 500ms
      - binary_sensor.template.publish:
          id: swipe_left
          state: OFF

  - id: swipe_right
    platform: template
    name: "Swipe Right"
    on_press:
      - delay: 500ms
      - binary_sensor.template.publish:
          id: swipe_right
          state: OFF

  - id: multi_touch
    platform: template
    name: "Multi Touch"
    on_press:
      - delay: 500ms
      - binary_sensor.template.publish:
          id: multi_touch
          state: OFF

  - id: long_press
    platform: template
    name: "Long Press"
    on_press:
      - delay: 500ms
      - binary_sensor.template.publish:
          id: long_press
          state: OFF

# ── Time (for periodic nightlight re-sync) ────────────────────────────────────
time:
  - platform: homeassistant
    on_time:
      - seconds: 0
        minutes: /5
        then:
          - lambda: id(tx).refresh_nightlight();

# ── Boot init ─────────────────────────────────────────────────────────────────
esphome:
  project:
    name: AntorFR.TX Ultimate
    version: "2.2.0"
  on_boot:
    priority: -100
    then:
      - binary_sensor.template.publish:
          id: swipe_left
          state: OFF
      - binary_sensor.template.publish:
          id: swipe_right
          state: OFF
      - binary_sensor.template.publish:
          id: multi_touch
          state: OFF
      - binary_sensor.template.publish:
          id: long_press
          state: OFF
      - lambda: id(tx).init_relays();
