# example/my_switch_3btn.yaml
# Example: 3-button TX Ultimate switch with inline relays, nightlight, audio,
# per-button press sensors, and the 3 built-in themes.
#
# Substitute:
#   - device_name / friendly_name
#   - secrets (wifi, OTA, API key)
#   - HA nightlight / sleep / away sensor entity IDs

substitutions:
  device_name: living-room-switch
  friendly_name: "Living Room Switch"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  api_encryption_key: !secret api_encryption_key

  # Nightlight sensors (Home Assistant entity IDs)
  ha_night_sensor: binary_sensor.is_nighttime
  ha_sleep_sensor: binary_sensor.master_bedroom_sleep
  ha_away_sensor:  binary_sensor.home_away

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

packages:
  hw: github://AntorFr/esphome-tx-ultimate/packages/tx_ultimate_hw.yaml@main

  # Themes — each package appends to the themes list
  theme_default:   github://AntorFr/esphome-tx-ultimate/packages/themes/default.yaml@main
  theme_christmas: github://AntorFr/esphome-tx-ultimate/packages/themes/christmas.yaml@main
  theme_stars:     github://AntorFr/esphome-tx-ultimate/packages/themes/explore_the_stars.yaml@main

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: ${friendly_name} Fallback
    password: ${ota_password}

ota:
  - platform: esphome
    password: ${ota_password}

api:
  encryption:
    key: ${api_encryption_key}

# ── Nightlight sensors from Home Assistant ────────────────────────────────────
binary_sensor:
  - platform: homeassistant
    id: night_sensor
    entity_id: ${ha_night_sensor}
    trigger_on_initial_state: true

  - platform: homeassistant
    id: sleep_sensor
    entity_id: ${ha_sleep_sensor}
    trigger_on_initial_state: true

  - platform: homeassistant
    id: away_sensor
    entity_id: ${ha_away_sensor}
    trigger_on_initial_state: true

# ── Media player pipeline (wired to the speaker defined in hw package) ────────
media_player:
  - platform: speaker
    name: "Media Player"
    id: mp
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 1.0
    files:
      - id: sound_click
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/clic.flac
      - id: sound_long_press
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/long_press.flac
      - id: sound_multi_press
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/multi_press.flac
      - id: sound_slide
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/slide.flac

# ── Main switch component ─────────────────────────────────────────────────────
tx_ultimate_switch:
  id: tx

  buttons:
    - position: left
      switch_relay: true
      relay:
        id: relay_1
        name: "L1"
        output: l1_output
        restore_mode: RESTORE_DEFAULT_OFF
      sensor:
        name: "Touchfield Gauche"

    - position: center
      switch_relay: true
      relay:
        id: relay_2
        name: "L2"
        output: l2_output
        restore_mode: RESTORE_DEFAULT_OFF
      sensor:
        name: "Touchfield Centre"

    - position: right
      switch_relay: fallback_ha     # toggle locally only when HA is down
      relay:
        id: relay_3
        name: "L3"
        output: l3_output
        restore_mode: RESTORE_DEFAULT_OFF
      sensor:
        name: "Touchfield Droit"

  leds: leds

  vibra: vibra
  media_player: mp
  api_connected: api_connected
  wifi_connected: wifi_connected

  nightlight:
    sensor: night_sensor
    sleep_sensor: sleep_sensor
    away_sensor: away_sensor
    # room_type: standard   # standard (default) | bedroom | dark — see README

  # Themes are merged from the packages above. Active theme can be switched
  # at runtime via the auto-generated HA select entity.
  active_theme: "Default"

  sound_packs:
    - name: explore_the_stars
      click:       sound_click
      long_press:  sound_long_press
      multi_press: sound_multi_press
      slide:       sound_slide

  button_on_time: 500ms
  touch_led_duration: 6s
