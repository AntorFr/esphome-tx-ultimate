substitutions:
  device_name: desk-light-switch
  friendly_name: "Bouton applique bureau"
  area: "Bureau"

  # Relay 1 — reste ON en permanence pour alimenter l'ampoule connectée (ex. Hue)
  relay_1_restore_mode: RESTORE_DEFAULT_ON

  # Capteur HA utilisé comme inhibiteur de nightlight quand absent
  ha_away_sensor: input_boolean.away_mode

  # Optionnel : décommenter + ajouter le binary_sensor HA pour activer le nightlight auto
  # ha_night_sensor: binary_sensor.is_nighttime

  # ESP-NOW — MAC WiFi de office-light-switch
  # Obtenir via logs ESPHome : "[I][wifi] WiFi MAC Address: XX:XX:XX:XX:XX:XX"
  espnow_peer_mac: "54:43:B2:71:BB:38"   # MAC de office-light-switch

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: ${area}

packages:
  hw:
    url: https://github.com/AntorFr/esphome-tx-ultimate
    ref: main
    files:
      - packages/tx_ultimate_hw.yaml
    refresh: 0s
  themes:
    url: https://github.com/AntorFr/esphome-tx-ultimate
    ref: main
    files:
      - packages/themes/default.yaml
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${device_name}.intra.sberard.fr
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret ap_password

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption
  reboot_timeout: 15min

web_server:

# ── ESP-NOW fallback : pilote relay_1 de office-light-switch quand HA est down ─
external_components:
  - source:
      type: git
      url: https://github.com/AntorFr/esphome-espnow
      ref: main
    refresh: 0s
    components: [espnow_sender]

espnow_sender:
  id: espnow_tx
  peer_mac: ${espnow_peer_mac}
  connectivity_sensor_id: api_connected   # réutilise le binary_sensor hw.yaml (delayed_off: 30s)
  fallback_timeout: 30s
  recovery_timeout: 10s
  action: toggle
  on_fallback_enter:
    - light.turn_on:
        id: leds_top
        effect: "Scan"
  on_fallback_exit:
    - light.turn_on:
        id: leds_top

# Déclenche send_command() au release du bouton (no-op en mode normal)
tx_ultimate_touch:
  on_release:
    - lambda: id(espnow_tx).send_command(true);

# ── Capteur "mode absent" depuis Home Assistant ───────────────────────────────
binary_sensor:
  - platform: homeassistant
    id: away_sensor
    entity_id: ${ha_away_sensor}
    trigger_on_initial_state: true

  # Décommenter si ha_night_sensor est défini :
  # - platform: homeassistant
  #   id: night_sensor
  #   entity_id: ${ha_night_sensor}
  #   publish_initial_state: true

# ── Media player + sons explore_the_stars ────────────────────────────────────
media_player:
  - platform: speaker
    name: "Media Player"
    id: mp
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 1.0
    files:
      - id: sound_click
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/clic.flac
      - id: sound_long_press
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/long_press.flac
      - id: sound_multi_press
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/multi_press.flac
      - id: sound_slide
        file: https://raw.githubusercontent.com/AntorFr/esphome-projects/refs/heads/master/sounds/tx_ultimate/explore_the_stars/slide.flac

# ── Composant switch principal ────────────────────────────────────────────────
tx_ultimate_switch:
  id: tx
  button_count: 1

  buttons:
    button_1:               # bouton unique (droite)
      switch_relay: false   # relay toujours ON — ampoule connectée (ex. Hue) alimentée en permanence
      relay: relay_1        # c'est HA qui pilote l'ampoule, pas le relay

  leds: leds
  leds_top: leds_top
  leds_nightlight: leds_nightlight

  vibra: vibra
  media_player: mp
  api_connected: api_connected

  nightlight:
    # sensor: night_sensor   # décommenter si ha_night_sensor est configuré
    away_sensor: away_sensor   # désactive le nightlight quand absent

  active_theme: "Explore the Stars"

  sound_packs:
    - name: explore_the_stars
      click: sound_click
      long_press: sound_long_press
      multi_press: sound_multi_press
      slide: sound_slide

