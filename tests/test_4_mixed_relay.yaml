# tests/test_4_mixed_relay.yaml
# Tests mixing inline relay declaration with external id reference.
esphome:
  name: test-mixed

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

external_components:
  - source: ../components
    components: [tx_ultimate_touch, tx_ultimate_switch]
  - source: github://AntorFr/esphome-addressable-effects@main
    components: [custom_addressable_effects]

custom_addressable_effects:

logger:
  level: DEBUG

api:

wifi:
  ssid: test
  password: testtest

uart:
  id: my_uart
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 115200

output:
  - id: l1_output
    platform: gpio
    pin: GPIO18
  - id: l2_output
    platform: gpio
    pin: GPIO17
  - id: l3_output
    platform: gpio
    pin: GPIO27

# External declaration of relay_2 — should coexist with inline relay_1 / relay_3.
light:
  - id: relay_2
    platform: binary
    name: "L2-external"
    output: l2_output

  - id: leds
    platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: GPIO13
    num_leds: 28
    name: "NeoPixel"
    internal: true

switch:
  - id: vibra
    platform: gpio
    pin: GPIO21
    name: "Vibration"
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 50ms
      - switch.turn_off: vibra

binary_sensor:
  - platform: status
    name: "API Status"
    id: api_connected
    internal: true

tx_ultimate_touch:
  id: tx_touch
  uart_id: my_uart
  on_press:
    - lambda: id(tx).on_touch_press();
  on_release:
    - lambda: id(tx).on_touch_release(touch.x);
  on_swipe_left:
    - lambda: id(tx).on_swipe_left();
  on_swipe_right:
    - lambda: id(tx).on_swipe_right();
  on_full_touch_release:
    - lambda: id(tx).on_full_touch_release();
  on_long_touch_release:
    - lambda: id(tx).on_long_touch_release();

tx_ultimate_switch:
  id: tx
  buttons:
    - position: left
      switch_relay: true
      relay:                            # inline
        id: relay_1
        name: "L1-inline"
        output: l1_output
    - position: center
      switch_relay: true
      relay: relay_2                    # ref to external declaration
    - position: right
      switch_relay: true
      relay:                            # inline
        id: relay_3
        name: "L3-inline"
        output: l3_output
        icon: mdi:lightbulb
  leds: leds
  api_connected: api_connected
  themes:
    - name: "Default"
      button:
        color: [0, 0, 100]
        brightness: 0.7
      nightlight:
        color: [80, 70, 0]
        brightness: 0.2
      touch:
        color: [0, 100, 100]
        brightness: 1.0
      swipe_left:
        color: [0, 100, 0]
        brightness: 1.0
      swipe_right:
        color: [100, 0, 70]
        brightness: 1.0
      long_press:
        color: [100, 0, 0]
        brightness: 1.0
      multi_touch:
        color: [0, 0, 0]
        brightness: 1.0
  active_theme: "Default"
