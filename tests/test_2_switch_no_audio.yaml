# tests/test_2_switch_no_audio.yaml
# Tests schema validation of tx_ultimate_switch (3 buttons, no media player, no sound).
# Run: ../venv/bin/esphome compile --only-generate tests/test_2_switch_no_audio.yaml

esphome:
  name: test-switch-no-audio

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"

psram:
  mode: quad
  speed: 40MHz

external_components:
  - source: ../components
    components: [tx_ultimate_touch, tx_ultimate_switch]
  - source: github://AntorFr/esphome-addressable-effects@main
    components: [custom_addressable_effects]

custom_addressable_effects:

logger:
  level: DEBUG

api:

wifi:
  ssid: test
  password: testtest

uart:
  id: my_uart
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 115200

output:
  - id: l1_output
    platform: gpio
    pin: GPIO18
  - id: l2_output
    platform: gpio
    pin: GPIO17
  - id: l3_output
    platform: gpio
    pin: GPIO27

light:
  - id: relay_1
    platform: binary
    name: "L1"
    output: l1_output

  - id: relay_2
    platform: binary
    name: "L2"
    output: l2_output

  - id: relay_3
    platform: binary
    name: "L3"
    output: l3_output

  - id: leds
    platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: GPIO13
    num_leds: 28
    name: "NeoPixel"
    internal: true
    default_transition_length: 0ms
    effects:
      - addressable_rainbow:
          name: "Rainbow"



switch:
  - id: vibra
    platform: gpio
    pin: GPIO21
    name: "Vibration"
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 50ms
      - switch.turn_off: vibra

binary_sensor:
  - platform: status
    name: "API Status"
    id: api_connected
    internal: true

  - platform: homeassistant
    id: night_sensor
    entity_id: binary_sensor.is_nighttime
    internal: true

tx_ultimate_touch:
  id: tx_touch
  uart_id: my_uart
  on_press:
    - lambda: id(tx).on_touch_press();
  on_release:
    - lambda: id(tx).on_touch_release(touch.x);
  on_swipe_left:
    - lambda: id(tx).on_swipe_left();
  on_swipe_right:
    - lambda: id(tx).on_swipe_right();
  on_full_touch_release:
    - lambda: id(tx).on_full_touch_release();
  on_long_touch_release:
    - lambda: id(tx).on_long_touch_release();

tx_ultimate_switch:
  id: tx
  button_count: 3
  buttons:
    - switch_relay: true
      relay: relay_1
    - switch_relay: true
      relay: relay_2
    - switch_relay: true
      relay: relay_3
  leds: leds
  vibra: vibra
  api_connected: api_connected
  nightlight:
    sensor: night_sensor
  themes:
    - name: "Default"
      button:
        color: [0, 0, 100]
        brightness: 0.7
      nightlight:
        color: [80, 70, 0]
        brightness: 0.2
      touch:
        color: [0, 100, 100]
        brightness: 1.0
        effect:
          type: scan
      swipe_left:
        color: [0, 100, 0]
        brightness: 1.0
      swipe_right:
        color: [100, 0, 70]
        brightness: 1.0
      long_press:
        color: [100, 0, 0]
        brightness: 1.0
      multi_touch:
        color: [0, 0, 0]
        brightness: 1.0
        effect:
          type: rainbow
  active_theme: "Default"
  button_on_time: 500ms
  touch_led_duration: 6s
